[workspace]
members = [
  "rust/*"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/easton/builderkit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
askama = "0.16.0"
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true        # Link-Time Optimization for smaller, faster binaries
codegen-units = 1 # Reduces parallel compilation but maximizes optimization
strip = true      # Strips symbols and debug info automatically