name: Darwin release artifact

on:
  push:
    tags:
      - "bundle/[0-9][0-9][0-9][0-9].[0-9][0-9].*"

permissions:
  contents: write

jobs:
  release-darwin-flake:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: verify calver
        id: version
        run: |
          version="${GITHUB_REF_NAME#bundle/}"
          if ! [[ "$version" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "Tag must use bundle/YYYY.MM.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: assemble darwin artifact from tag
        run: nix develop -c just assemble darwin dist/darwin

      - name: check artifact
        run: nix flake check "path:$PWD/dist/darwin"

      - name: package artifact
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -C dist/darwin -czf "builderkit-darwin-${BUNDLE_VERSION}.tar.gz" flake.nix flake.lock
          sha256sum "builderkit-darwin-${BUNDLE_VERSION}.tar.gz" > "builderkit-darwin-${BUNDLE_VERSION}.tar.gz.sha256"

      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Builder Kit $BUNDLE_VERSION" \
            --notes "Builder Kit Darwin flake artifact for $BUNDLE_VERSION." \
            "builderkit-darwin-${BUNDLE_VERSION}.tar.gz" \
            "builderkit-darwin-${BUNDLE_VERSION}.tar.gz.sha256"
